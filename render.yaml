# Render Blueprint（参考用）
# 実際のサービスは Render ダッシュボードから手動で作成している。
# この内容は各サービスの設定値の控え。Blueprint として適用すると
# 同名の新しいサービスが作られる可能性があるので注意。
services:
  # バックエンド（FastAPI）
  - type: web
    name: tsukisamu-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Supabase の Session pooler（ポート 5432）。postgresql+asyncpg:// に書き換えて設定
      - key: DATABASE_URL
        sync: false
      # フロント（Static Site）の URL。複数はカンマ区切り。末尾スラッシュなし
      - key: CORS_ORIGINS
        sync: false

  # フロントエンド（Next.js を静的書き出しして配信）
  - type: web
    name: tsukisamu-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: "22"
      # ビルド時に画面のコードへ埋め込まれる。変更したら再デプロイが必要
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://tsukisamu-api.onrender.com
